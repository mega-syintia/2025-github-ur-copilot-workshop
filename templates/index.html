<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
  <div id="app">
    <h1>Pomodoro Timer</h1>
    <div id="timer">
      <div id="session-info">
        <span id="cycle-type">Work Session</span>
        <span id="cycle-count">1/4</span>
      </div>
      <div id="time">25:00</div>
      <div id="controls">
        <button id="start">Start</button>
        <button id="pause">Pause</button>
        <button id="reset">Reset</button>
        <button id="skip">Skip</button>
      </div>
    </div>

    <div id="settings-section">
      <h3>Settings</h3>
      <div class="setting-group">
        <label>Work Duration (min): <input type="number" id="work-duration" min="1" max="60" value="25"></label>
      </div>
      <div class="setting-group">
        <label>Short Break (min): <input type="number" id="short-break" min="1" max="30" value="5"></label>
      </div>
      <div class="setting-group">
        <label>Long Break (min): <input type="number" id="long-break" min="1" max="60" value="15"></label>
      </div>
      <div class="setting-group">
        <label>Cycles until long break: <input type="number" id="cycles-until-long" min="2" max="10" value="4"></label>
      </div>
      <button id="save-settings">Save Settings</button>
    </div>

    <div id="status-section">
      <h3>Current Status</h3>
      <div id="status">Ready to start</div>
    </div>

    <div id="history-section">
      <h3>Session History</h3>
      <div id="history"></div>
    </div>
  </div>
  <script src="/static/js/timer.js"></script>
</body>

</html>
